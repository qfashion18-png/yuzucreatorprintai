version: 1
applications:
  - appRoot: creator-print-ai/apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@11.0.9
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter web build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - ../../node_modules/**/*
