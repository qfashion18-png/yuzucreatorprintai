version: 1
applications:
  - appRoot: apps/web
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm install -g pnpm@11.0.9
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter web build
            - bash scripts/prepare-amplify-runtime.sh
      artifacts:
        baseDirectory: apps/web/.next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - apps/web/node_modules/**/*
